<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شفاء ميد | تسجيل الدخول</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>شفاء ميد للمعدات الطبية</h1>
    <nav aria-label="التنقل الرئيسي">
      <a href="index.html">الرئيسية</a> |
      <a href="products.html">المنتجات</a> |
      <a href="about.html">من نحن</a> |
      <a href="contact.html">تواصل معنا</a> |
      <a href="login.html">تسجيل الدخول</a> |
      <a href="preview.html">معاينة النظام</a>
    </nav>
  </header>
  <hr>

  <main>
    <h2>تسجيل الدخول</h2>
    <p>أدخل بياناتك للمتابعة إلى اختيار المنتجات والاستفسار عنها.</p>
    <form action="#" method="post">
      <fieldset>
        <legend>بيانات الحساب</legend>
        <p>
          <label for="email">البريد الإلكتروني:</label><br>
          <input type="email" id="email" name="email" required autocomplete="email">
        </p>
        <p>
          <label for="password">كلمة المرور:</label><br>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password">
        </p>
        <p>
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">تذكرني</label>
        </p>
        <button type="submit">دخول</button>
      </fieldset>
    </form>
    <p>ليس لديك حساب؟ <a href="contact.html">تواصل مع فريقنا لإنشاء حساب</a></p>
    <p><a href="products.html">العودة إلى المنتجات</a></p>
  </main>

  <hr>
  <footer><p><a href="index.html">العودة إلى الصفحة الرئيسية</a></p></footer>
  <script src="script.js"></script>
</body>
</html>
